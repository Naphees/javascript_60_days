<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Output Handle</title>
    
    
</head>
<body>
     <h1>JavaScript Output </h1>
     <p id ="demo"></p>
     <script>
        // By innerHTML
        document.getElementById("demo").innerHTML ="Hello World"
        document.write(5 + 5) // 10 used for testing
        alert("Hello") // using pop up
        console.log("use debugging")
    </script>
    <button onclick="window.print()">Print Current Window</button>
    
</body>
</html>
